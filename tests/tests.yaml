# yamllint disable rule:line-length
---
rule_files:
  - ../prometheus_alerts.yaml

tests:
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-exporter", instance="test"}'
        values: "0+0x5"
    alert_rule_test:
      - eval_time: 5m
        alertname: BlackboxProbeFailed
        exp_alerts:
          - exp_labels:
              job: blackbox-exporter
              instance: test
              severity: critical
            exp_annotations:
              summary: "Probe has failed for the past 1m interval."
              description: "The probe failed for the instance test."
              dashboard_url: "https://grafana.com/d/blackbox-exporter-j4da/blackbox-exporter?var-instance=test"
  - interval: 1d
    input_series:
      - series: 'probe_success{job="blackbox-exporter", instance="test"}'
        values: "0+0x30"
    alert_rule_test:
      - eval_time: 10d
        alertname: BlackboxLowUptime30d
        exp_alerts:
          - exp_labels:
              job: blackbox-exporter
              instance: test
              severity: info
            exp_annotations:
              summary: "Probe uptime is lower than 99.9% for the last 30 days."
              description: "The probe has a lower uptime than 99.9% the last 30 days for the instance test."
              dashboard_url: "https://grafana.com/d/blackbox-exporter-j4da/blackbox-exporter?var-instance=test"
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox-exporter", instance="test"}'
        # cert expiry is time() + 10 days (< 21 day threshold)
        values: "864000+0x5"
    alert_rule_test:
      - eval_time: 5m
        alertname: BlackboxSslCertificateWillExpireSoon
        exp_alerts:
          - exp_labels:
              job: blackbox-exporter
              instance: test
              severity: warning
            exp_annotations:
              summary: "SSL certificate will expire soon."
              description: "The SSL certificate of the instance test is expiring within 21 days.\nActual time left: 9d 23h 55m 0s.\n"
              dashboard_url: "https://grafana.com/d/blackbox-exporter-j4da/blackbox-exporter?var-instance=test"
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox-exporter", instance="test"}'
        # cert expiry is in the past
        values: "0+0x5"
    alert_rule_test:
      - eval_time: 5m
        alertname: BlackboxSslCertificateWillExpireSoon
        exp_alerts: []
      - eval_time: 5m
        alertname: BlackboxSslCertificateExpired
        exp_alerts:
          - exp_labels:
              job: blackbox-exporter
              instance: test
              severity: warning
            exp_annotations:
              summary: "SSL certificate has expired."
              description: "The SSL certificate of the instance test has expired.\nActual time left: -5m 0s.\n"
              dashboard_url: "https://grafana.com/d/blackbox-exporter-j4da/blackbox-exporter?var-instance=test"
